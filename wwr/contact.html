```html
<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact Dira Luke Water Rafting for reservations, questions, and rafting adventure information.">
    <meta name="author" content="Dira Luke">
    <title>Contact Us | Dira Luke Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-wwr-oars.png" alt="Rafting Company Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- CONTACT INFORMATION -->
        <section class="contact-info">
            <h1>Contact Us</h1>

            <p><strong>Address:</strong> Kampala, Uganda</p>
            <p><strong>Phone:</strong> +256 750831140</p>
            <p><strong>Email:</strong> info@diraluke-rafting.com</p>

            <!-- Replace src with your own Google Map embed link -->
            <iframe
                src="https://www.google.com/maps/embed?pb="
                width="400"
                height="250"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpeg"
                        alt="Lead rafting guide">
                    <figcaption>John — Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpeg"
                        alt="Operations manager">
                    <figcaption>Sarah — Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpeg"
                        alt="Safety instructor">
                    <figcaption>David — Safety Instructor</figcaption>
                </figure>

            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose"
                            value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose"
                            value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose"
                            value="website">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message"
                    name="message"
                    rows="5"
                    required></textarea>

                <label class="checkbox">
                    <input type="checkbox"
                        name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 | Dira Luke Water Rafting | Dira Luke</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-square.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-square.svg" alt="Instagram">
            </a>

            <a href="https://whatsapp.com" target="_blank">
                <img src="images/whatsapp.svg" alt="WhatsApp">
            </a>
        </nav>
    </footer>

</body>

</html>
```
